name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # jsdom@30 (via isomorphic-dompurify) pulls in undici@8, which
          # needs a newer Node baseline than a plain "20" reliably gives
          # you in Actions' runner image — 22 is the first LTS confirmed
          # to have the built-in APIs it expects.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Blocking on purpose: fails the job on any high/critical advisory in
      # the dependencies actually shipped to production. --omit=dev drops
      # the one residual finding (a `braces` DoS advisory with no fix
      # published yet) that lives entirely inside eslint-config-next's own
      # lint-tooling chain — it never reaches the app or its users, and
      # there is no newer `braces` release to upgrade to.
      - name: Security scan
        run: npm audit --audit-level=high --omit=dev

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Lint
        run: npm run lint

      - name: Unit tests (with coverage)
        run: npm run test:cov

      - name: Build
        run: npm run build

  # Only runs on a real push to main (not on the PR that merged into it),
  # and only once the ci job above is green.
  deploy-production:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.production_url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN_TICKETING }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN_TICKETING }}

      - name: Deploy to production
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN_TICKETING }})
          echo "production_url=$url" >> "$GITHUB_OUTPUT"

      # Shallow post-deploy check, not a replacement for the unit suite:
      # confirms the freshly deployed build actually serves traffic before
      # trusting the deploy. Retries ride out the brief propagation window
      # right after `vercel deploy` returns.
      - name: Smoke test
        run: |
          url="${{ steps.deploy.outputs.production_url }}/login"
          status=$(curl -s -o /dev/null -w "%{http_code}" --retry 5 --retry-delay 5 --retry-all-errors "$url")
          echo "GET $url -> $status"
          if [ "$status" -ge 400 ]; then
            echo "Smoke test failed: $url returned $status"
            exit 1
          fi
